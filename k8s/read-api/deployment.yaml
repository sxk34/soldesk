apiVersion: apps/v1
kind: Deployment
metadata:
  name: read-api
  namespace: ticketing
  labels:
    app: read-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: read-api
  template:
    metadata:
      labels:
        app: read-api
    spec:
      containers:
        - name: read-api
          image: ticketing/ticketing-was:latest
          command: ["uvicorn", "read_app:app", "--host", "0.0.0.0", "--port", "5000"]
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: ticketing-config
            - secretRef:
                name: ticketing-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /api/read/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/read/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
