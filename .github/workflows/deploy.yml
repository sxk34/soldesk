name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION:    ap-northeast-2
  EKS_CLUSTER:   ${{ secrets.EKS_CLUSTER }}
  ECR_REGISTRY:  ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com

permissions:
  id-token: write
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ticketing-was: ${{ steps.filter.outputs.ticketing-was }}
      worker-svc:    ${{ steps.filter.outputs.worker-svc }}
      frontend:      ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ticketing-was:
              - 'services/ticketing-was/**'
            worker-svc:
              - 'services/worker-svc/**'
            frontend:
              - 'frontend/**'

  deploy-ticketing-was:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ticketing-was == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Docker Build & Push
        working-directory: services/ticketing-was
        run: |
          IMAGE=${{ env.ECR_REGISTRY }}/ticketing/ticketing-was
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
      - name: EKS kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}
      - name: Rolling Deploy (read-api + write-api)
        run: |
          IMAGE=${{ env.ECR_REGISTRY }}/ticketing/ticketing-was:${{ github.sha }}
          kubectl set image deployment/read-api read-api=$IMAGE -n ticketing
          kubectl set image deployment/write-api write-api=$IMAGE -n ticketing
          kubectl rollout status deployment/read-api -n ticketing --timeout=120s
          kubectl rollout status deployment/write-api -n ticketing --timeout=120s

  deploy-worker-svc:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.worker-svc == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Docker Build & Push
        working-directory: services/worker-svc
        run: |
          IMAGE=${{ env.ECR_REGISTRY }}/ticketing/worker-svc
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
      - name: EKS kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}
      - name: Rolling Deploy
        run: |
          kubectl set image deployment/worker-svc worker-svc=${{ env.ECR_REGISTRY }}/ticketing/worker-svc:${{ github.sha }} -n ticketing
          kubectl rollout status deployment/worker-svc -n ticketing --timeout=120s
